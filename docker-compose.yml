services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ardh-db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Express
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ardh-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: docker
      ConnectionStrings__DefaultConnection: "Server=db;Database=ArdhDb;User ID=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true;"
      # Public URL used to build absolute file URLs (e.g. /image/... uploads).
      # AppUrl stays as the internal localhost:8080 address - it's only used for
      # the container's own self-ping health check, not shown to clients.
      BaseURL: https://api.ardh.co.in
      Identity__Key: ${IDENTITY_KEY}
      MailConfigurations__Host: ${MAIL_SMTP_HOST}
      MailConfigurations__Port: ${MAIL_SMTP_PORT}
      MailConfigurations__UseSsl: ${MAIL_SMTP_USE_SSL}
      MailConfigurations__Username: ${MAIL_SMTP_USERNAME}
      MailConfigurations__Password: ${MAIL_SMTP_PASSWORD}
      MailConfigurations__From: ${MAIL_FROM}
      AdminSettings__Password: ${ADMIN_PANEL_PASSWORD}
      # Leave unset for normal startup. Set to "reset" or "wipe" (see DEPLOYMENT.md)
      # only for one-off maintenance restarts, then unset again.
      SEED_MODE: ${SEED_MODE:-}
    ports:
      # Only bind to localhost - Nginx (installed on the host) reverse-proxies
      # to this port. The container is never exposed directly to the internet.
      - "127.0.0.1:8080:8080"
    volumes:
      - api-uploads:/app/image

volumes:
  mssql-data:
  api-uploads:
